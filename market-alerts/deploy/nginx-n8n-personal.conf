# Optional public door for the transcript n8n. Install on the VPS only after
# automations.chartsignl.com has an A record to this server.
#   certbot certonly --nginx -d automations.chartsignl.com
# ChartSignl n8n (n8n.chartsignl.com -> 127.0.0.1:5678) is a different site.

server {
    listen 80;
    listen [::]:80;
    server_name automations.chartsignl.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name automations.chartsignl.com;

    ssl_certificate /etc/letsencrypt/live/automations.chartsignl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/automations.chartsignl.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:5679;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
